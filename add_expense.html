<body class="h-full bg-background text-ink antialiased">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background w-full top-0 sticky border-b border-rule dark:border-on-surface-variant flex justify-between items-center px-base-margin h-14 z-40 transition-colors duration-200">
<div class="flex items-center gap-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-variant p-2 rounded transition-colors duration-200">
<span class="material-symbols-outlined font-variation-settings-'FILL'-1" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim font-bold tracking-tight">Digital Ledger</h1>
<div class="flex items-center gap-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-variant p-2 rounded transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</div>
</header>
<main class="max-w-2xl mx-auto px-base-margin py-6 pb-24 space-y-6">
<section>
<h2 class="font-display-lg text-display-lg text-primary mb-1">New Expense</h2>
<p class="font-body-md text-body-md text-subtle-text">Record a financial transaction into the ledger.</p>
</section>
<form class="space-y-6">
<!-- Core Details Container -->
<div class="bg-paper-card border border-rule rounded p-card-padding space-y-4">
<!-- Date & Type Row -->
<div class="grid grid-cols-2 gap-grid-gap">
<div class="flex flex-col">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1">Date</label>
<input class="font-body-md text-body-md bg-transparent border border-rule rounded p-input-padding focus:ring-0 focus:border-brass-light text-ink outline-none" type="date" value="2023-10-24"/>
</div>
<div class="flex flex-col">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1">Expense Type</label>
<select class="font-body-md text-body-md bg-transparent border border-rule rounded p-input-padding focus:ring-0 focus:border-brass-light text-ink outline-none appearance-none">
<option>Normal Operating</option>
<option>Special Event</option>
<option>Capital Expenditure</option>
</select>
</div>
</div>
<!-- Category Picker -->
<div>
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-2 block">Category</label>
<div class="grid grid-cols-4 gap-2">
<button class="flex flex-col items-center justify-center p-3 border border-rule bg-surface-container rounded gap-2 hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-cat-water group-hover:scale-110 transition-transform" data-icon="water_drop">water_drop</span>
<span class="font-label-sm-caps text-label-sm-caps text-ink">Water</span>
</button>
<button class="flex flex-col items-center justify-center p-3 border border-rule bg-surface-container rounded gap-2 hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-cat-electricity group-hover:scale-110 transition-transform" data-icon="bolt">bolt</span>
<span class="font-label-sm-caps text-label-sm-caps text-ink">Electric</span>
</button>
<button class="flex flex-col items-center justify-center p-3 border border-brass-light bg-secondary-fixed rounded gap-2 transition-colors group relative shadow-[0_4px_12px_rgba(0,0,0,0.1)] z-10" type="button">
<span class="material-symbols-outlined text-secondary-fixed-variant group-hover:scale-110 transition-transform" data-icon="restaurant">restaurant</span>
<span class="font-label-sm-caps text-label-sm-caps text-ink font-bold">Food</span>
<div class="absolute inset-0 border-2 border-brass-light rounded pointer-events-none"></div>
</button>
<button class="flex flex-col items-center justify-center p-3 border border-rule bg-surface-container rounded gap-2 hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-cat-maintenance group-hover:scale-110 transition-transform" data-icon="build">build</span>
<span class="font-label-sm-caps text-label-sm-caps text-ink">Maint.</span>
</button>
</div>
</div>
<!-- Description & Amount -->
<div class="space-y-4 pt-2 border-t border-rule border-dashed">
<div class="flex flex-col">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1">Description</label>
<input class="font-body-md text-body-md bg-transparent border border-rule rounded p-input-padding focus:ring-0 focus:border-brass-light text-ink outline-none" placeholder="e.g., Sunday Service Refreshments" type="text"/>
</div>
<div class="flex flex-col items-end bg-surface-container p-4 rounded border border-rule">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1 w-full text-right">Amount (USD)</label>
<div class="flex items-center text-red-ink">
<span class="font-data-lg text-data-lg mr-1">$</span>
<input class="font-data-lg text-display-lg bg-transparent border-none p-0 text-right focus:ring-0 text-red-ink w-32 outline-none" step="0.01" style="font-size: 24px; line-height: 28px;" type="number" value="145.50"/>
</div>
</div>
</div>
</div>
<!-- Optional Details Section -->
<details class="group border border-rule bg-paper-card rounded p-card-padding">
<summary class="flex justify-between items-center cursor-pointer list-none font-headline-sm text-headline-sm text-primary select-none">
<span>Additional Details (Optional)</span>
<span class="material-symbols-outlined transition-transform group-open:rotate-180" data-icon="expand_more">expand_more</span>
</summary>
<div class="mt-4 space-y-4 pt-4 border-t border-rule">
<div class="flex flex-col">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1">Vendor / Payee</label>
<input class="font-body-md text-body-md bg-transparent border border-rule rounded p-input-padding focus:ring-0 focus:border-brass-light text-ink outline-none" placeholder="Vendor Name" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-sm-caps text-label-sm-caps text-subtle-text uppercase mb-1">Notes</label>
<textarea class="font-body-md text-body-md bg-transparent border border-rule rounded p-input-padding focus:ring-0 focus:border-brass-light text-ink outline-none resize-none" rows="2"></textarea>
</div>
<button class="w-full py-3 border border-rule border-dashed rounded font-label-sm-caps text-label-sm-caps text-ink uppercase tracking-wide hover:bg-surface-container transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="attach_file">attach_file</span>
                        Attach Receipt
                    </button>
</div>
</details>
<!-- Actions -->
<div class="flex gap-4 pt-4 border-t-[3px] border-double border-ink">
<button class="flex-1 py-3 px-4 border border-rule border-dashed rounded font-label-sm-caps text-label-sm-caps text-ink uppercase tracking-wide hover:bg-surface-container transition-colors" type="button">
                    + Add to Batch
                </button>
<button class="flex-1 py-3 px-4 bg-green-deep text-paper-card rounded-lg font-headline-sm text-headline-sm hover:bg-primary-container transition-colors shadow-sm" type="submit">
                    Commit Entry
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="bg-paper-card dark:bg-surface-container-high fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 z-50 border-t border-rule dark:border-on-surface-variant shadow-sm md:hidden">
<a class="flex flex-col items-center justify-center text-subtle-text dark:text-outline-variant p-2 hover:opacity-80 active:scale-95 transition-transform group" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-subtle-text dark:text-outline-variant p-2 hover:opacity-80 active:scale-95 transition-transform group" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl p-2 hover:opacity-80 active:scale-95 transition-transform group" href="#">
<span class="material-symbols-outlined font-variation-settings-'FILL'-1" data-icon="add_circle">add_circle</span>
<span class="font-label-md text-label-md mt-1 font-bold">Add</span>
</a>
<a class="flex flex-col items-center justify-center text-subtle-text dark:text-outline-variant p-2 hover:opacity-80 active:scale-95 transition-transform group" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md mt-1">Invoices</span>
</a>
</nav>
<script>
        // Simple micro-interaction for amount input formatting
        const amountInput = document.querySelector('input[type="number"]');
        if(amountInput) {
            amountInput.addEventListener('blur', function() {
                if(this.value) {
                    this.value = parseFloat(this.value).toFixed(2);
                }
            });
        }
    </script>
</body></html>
